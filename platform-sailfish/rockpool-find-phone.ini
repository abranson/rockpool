[%define finder]
sound.profile = clock.alert.tone => sound.filename
sound.profile.fallback = clock.alert.tone@fallback => sound.filename
sound.stream.event.id = alarm-clock-elapsed
sound.stream.media.role = alarm
sound.repeat = true
core.max_timeout = 60000
sound.fade-in = 0,3,0,100
sound.fade-stop = 300

# Use the clock volume when audible. A muted alarm gets a private playback
# level for this request, without changing the profile or other streams.
[rockpool-find-phone => context@profile.general.clock.alert.volume == (int)0]
%include.1 = finder
sound.stream.module-stream-restore.id = x-static-volume-full

[rockpool-find-phone]
%include.1 = finder
sound.stream.module-stream-restore.id = x-clock-alert-volume
